<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#163344">
  <meta name="description" content="Cast, read the water, and bring home a catch at Moonlit Cove.">
  <title>Moonlit Cove — pixel fishing</title>
  <style>
    :root { color-scheme:dark; --ink:#f8f0d9; --muted:#a9c0bd; --gold:#ffd379; --panel:#142b38; }
    * { box-sizing:border-box; }
    html,body { margin:0; min-height:100%; background:#102630; }
    body { min-height:100svh; display:grid; place-items:center; padding:18px 12px max(18px,env(safe-area-inset-bottom)); color:var(--ink); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
    .game { width:min(100%,1000px); }
    .masthead { display:flex; align-items:end; justify-content:space-between; gap:12px; margin:0 3px 11px; }
    h1 { margin:0; font-size:clamp(18px,4vw,27px); letter-spacing:.08em; line-height:1; text-transform:uppercase; }
    h1 span { color:var(--gold); }
    .place { color:#a8bdba; font-size:10px; letter-spacing:.15em; text-transform:uppercase; white-space:nowrap; }
    .frame { overflow:hidden; border:2px solid #5c776f; border-radius:7px; background:#132a37; box-shadow:0 18px 50px #07161dbb, inset 0 0 0 2px #203b43; }
    canvas { display:block; width:100%; height:auto; aspect-ratio:16/9; image-rendering:pixelated; image-rendering:crisp-edges; touch-action:none; cursor:pointer; }
    .stats { display:flex; justify-content:space-between; gap:8px; padding:10px 14px; border-top:1px solid #35544f; background:#142b38; color:#a9c0bd; font-size:10px; letter-spacing:.09em; text-transform:uppercase; }
    .stats b { color:var(--gold); font-size:13px; }
    .controls { display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; margin-top:12px; }
    .hint { min-height:44px; color:#a9c0bd; font-size:clamp(11px,2.5vw,13px); line-height:1.5; }
    .hint strong { color:#fff2d1; }
    button { min-width:184px; min-height:52px; border:2px solid #ffdfa0; border-radius:5px; background:#efa94e; color:#30251d; box-shadow:0 4px 0 #985c37; font:900 13px/1 ui-monospace,monospace; letter-spacing:.09em; text-transform:uppercase; cursor:pointer; touch-action:none; user-select:none; -webkit-user-select:none; }
    button:hover { background:#ffc66b; }
    button:active { transform:translateY(2px); box-shadow:0 2px 0 #985c37; }
    button:focus-visible { outline:3px solid #fff; outline-offset:4px; }
    .footer { margin:13px 4px 0; color:#77918e; font-size:10px; line-height:1.5; text-align:center; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }
    @media(max-width:520px) {
      body { padding-inline:8px; }
      .controls { grid-template-columns:1fr; gap:8px; }
      .hint { min-height:34px; }
      button { width:100%; min-height:58px; }
      .stats { padding:9px 8px; font-size:8px; letter-spacing:.04em; }
      .stats b { font-size:11px; }
      .place { font-size:8px; letter-spacing:.1em; }
    }
    @media(prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <main class="game" aria-label="Moonlit Cove fishing game">
    <header class="masthead"><h1><span>Moonlit</span> Cove</h1><div class="place">Willowmere Lake · Early morning</div></header>
    <section class="frame" aria-label="Fishing game">
      <canvas id="game" width="480" height="270" aria-label="Pixel art fishing game. Hold to cast. Press when a fish bites. While reeling, release the button when the line tension turns red."></canvas>
      <div class="stats" aria-live="polite"><span>Fish <b id="catch-count">00</b></span><span>Biggest <b id="best-catch">—</b></span><span>Bag <b id="bag-weight">0.0 kg</b></span></div>
    </section>
    <div class="controls"><div class="hint" id="hint" aria-live="polite">The lake is waking up. <strong>Hold to cast your line.</strong></div><button id="action" type="button" aria-label="Hold to cast">Hold to cast</button></div>
    <p class="footer">Hold to cast · Hook on the splash · Reel steadily, then let go when the fish surges</p>
    <span class="sr-only" id="announcement" aria-live="assertive"></span>
  </main>
<script>
(() => {
  'use strict';
  const canvas=document.querySelector('#game'), ctx=canvas.getContext('2d');
  const button=document.querySelector('#action'), hint=document.querySelector('#hint');
  const countEl=document.querySelector('#catch-count'), bestEl=document.querySelector('#best-catch'), bagEl=document.querySelector('#bag-weight'), announcement=document.querySelector('#announcement');
  const W=480,H=270, waterline=134, rod={x:184,y:135};
  const backdrop=new Image();backdrop.src='assets/willowmere-dawn.png';
  const palette={sky:'#f2a86f', rose:'#d77767', hill:'#8e685e', hillShade:'#674e51', pine:'#31534f', pineDark:'#213e43', shore:'#866856', water:'#388286', waterLight:'#66a89a', deep:'#205b68', foam:'#b5d5b0', ink:'#183944', cream:'#fff0cf'};
  const fishKinds=[
    {name:'Pond Minnow',color:'#a8ddd0',belly:'#eaf1cf',weight:38,kg:[.2,.7],value:1,shape:'slim'},
    {name:'Sun Perch',color:'#f5bd68',belly:'#fff0c4',weight:32,kg:[.5,1.4],value:2,shape:'round'},
    {name:'Reed Pike',color:'#8dc28c',belly:'#d8e3ae',weight:20,kg:[1.2,3.2],value:4,shape:'long'},
    {name:'Moon Koi',color:'#e98776',belly:'#fff0d0',weight:9,kg:[2.5,5.5],value:8,shape:'koi'},
    {name:'Old Lake Sturgeon',color:'#a4a9c4',belly:'#e2d9ba',weight:1,kg:[6,12],value:20,shape:'long'}
  ];
  let phase='idle', t=0, phaseT=0, delta=0, charge=0, castPower=.55, bobberX=330, waitLeft=0, biteLeft=0;
  let fish=fishKinds[0], fishX=340, hookedProgress=0, tension=.12, snapTime=0, fightT=0, inputHeld=false, missCount=0;
  let particles=[], ripples=[], caught=Number(localStorage.getItem('moonlit-fish-count')||0), bag=Number(localStorage.getItem('moonlit-bag-kg')||0);
  let best=JSON.parse(localStorage.getItem('moonlit-best')||'null'), bestText=best?`${best.name} ${best.kg.toFixed(1)}kg`:'—';
  let toast='', toastTimer=0, last=0;
  const rand=(a,b)=>a+Math.random()*(b-a);
  const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));};
  function polygon(points,color){ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();ctx.fill();}
  function line(x1,y1,x2,y2,color,width=1){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
  function label(str,x,y,size=9,color=palette.cream,align='center'){ctx.fillStyle=color;ctx.font=`bold ${size}px ui-monospace,monospace`;ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(str,x,y);}
  function setPhase(value){phase=value;syncUI();}
  function syncUI(){
    const ui={idle:['Hold to cast','The lake is waking up. <strong>Hold to cast your line.</strong>'],charge:['Casting…','Pick your distance. <strong>Release to send it out.</strong>'],cast:['Line away…','A good cast. <strong>Watch the bobber.</strong>'],wait:['Waiting for a bite…','Give it a moment. <strong>The ripples will tell you.</strong>'],bite:['Hook it!','There! <strong>Press now, while the bobber is under!</strong>'],fight:['Hold to reel','Reel against the fish. <strong>Let go when the tension flashes red.</strong>'],landed:['Cast again','A fine catch. <strong>The lake has more stories.</strong>'],lost:['Cast again','The line went slack. <strong>Take a breath and cast again.</strong>']};
    const [title,copy]=ui[phase];button.textContent=title;button.setAttribute('aria-label',title);button.disabled=phase==='cast'||phase==='wait';hint.innerHTML=copy;
    countEl.textContent=String(caught).padStart(2,'0');bestEl.textContent=bestText;bagEl.textContent=`${bag.toFixed(1)} kg`;
  }
  function addRipple(x,y,life=1.2){ripples.push({x,y,life,max:life,r:2});}
  function splash(x,y,color=palette.foam,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:rand(-2.2,2.2),vy:rand(-3.5,-.4),life:rand(.35,.85),color,size:Math.random()<.6?2:3});for(let i=0;i<3;i++)addRipple(x+rand(-4,4),y+rand(-1,2),rand(.6,1.2));}
  function chooseFish(){let n=Math.random()*fishKinds.reduce((a,f)=>a+f.weight,0);return fishKinds.find(f=>(n-=f.weight)<=0)||fishKinds[0];}
  function press(){
    if(phase==='idle'||phase==='landed'||phase==='lost'){
      phase='charge';phaseT=0;charge=0;inputHeld=true;syncUI();return;
    }
    if(phase==='bite'){
      inputHeld=true;phase='fight';phaseT=0;fightT=0;hookedProgress=0;tension=.23;snapTime=0;fishX=bobberX-2;splash(bobberX,waterline+3,fish.color,13);announcement.textContent=`Hooked a ${fish.name}. Reel carefully, and ease off when tension is high.`;syncUI();return;
    }
    if(phase==='charge'){inputHeld=true;return;}
    if(phase==='fight'){inputHeld=true;return;}
  }
  function release(){
    if(!inputHeld)return; inputHeld=false;
    if(phase==='charge'){castPower=Math.max(.18,Math.min(1,charge));bobberX=208+castPower*205;phase='cast';phaseT=0;syncUI();}
  }
  function loseFish(){phase='lost';phaseT=0;inputHeld=false;missCount++;splash(bobberX,waterline+3,'#d6ded0',8);announcement.textContent='The fish escaped.';syncUI();}
  function landFish(){
    phase='landed';phaseT=0;inputHeld=false;caught++;
    const kg=rand(fish.kg[0],fish.kg[1]);bag+=kg;
    if(!best||kg>best.kg){best={name:fish.name,kg};bestText=`${fish.name} ${kg.toFixed(1)}kg`;localStorage.setItem('moonlit-best',JSON.stringify(best));}
    localStorage.setItem('moonlit-fish-count',String(caught));localStorage.setItem('moonlit-bag-kg',String(bag));
    toast=`${fish.name} · ${kg.toFixed(1)} kg`;toastTimer=2.5;
    splash(bobberX,waterline+2,fish.color,18);announcement.textContent=`You landed a ${kg.toFixed(1)} kilogram ${fish.name}.`;syncUI();
  }
  function tapAction(){if(phase==='bite')press();else if(phase==='idle'||phase==='landed'||phase==='lost'){press();release();}else if(phase==='charge')release();}
  function bindHold(el){
    el.addEventListener('pointerdown',e=>{e.preventDefault();if(el.setPointerCapture)el.setPointerCapture(e.pointerId);press();},{passive:false});
    el.addEventListener('pointerup',e=>{e.preventDefault();release();},{passive:false});
    el.addEventListener('pointercancel',release);el.addEventListener('lostpointercapture',release);
    el.addEventListener('click',e=>{if(e.detail===0)tapAction();});
  }
  bindHold(button);bindHold(canvas);
  window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);
  window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();press();}});
  window.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release();}});
  window.addEventListener('blur',release);

  function drawBackdrop(){
    if(backdrop.complete&&backdrop.naturalWidth){ctx.drawImage(backdrop,0,0,W,H);return;}
    // A quiet fallback keeps the game playable while the pixel-art backdrop loads.
    const sky=ctx.createLinearGradient(0,0,0,waterline);sky.addColorStop(0,'#e9a47a');sky.addColorStop(1,'#c7776f');ctx.fillStyle=sky;ctx.fillRect(0,0,W,waterline);
    const lake=ctx.createLinearGradient(0,waterline,0,H);lake.addColorStop(0,'#478a83');lake.addColorStop(1,'#174c5d');ctx.fillStyle=lake;ctx.fillRect(0,waterline,W,H-waterline);
    polygon([[0,waterline],[76,71],[132,95],[212,61],[284,100],[354,66],[480,101],[480,waterline]],'#536c61');
    polygon([[0,waterline],[79,85],[155,104],[265,73],[340,106],[418,80],[480,107],[480,waterline]],'#324f4b');
    polygon([[0,218],[222,180],[260,194],[36,270],[0,270]],'#b57f59');
  }
  function drawWater(){
    // Moving flecks catch the sunrise without obscuring the painted water.
    ctx.save();ctx.globalAlpha=.38;
    for(let row=0;row<7;row++){
      const y=waterline+17+row*17;
      for(let i=0;i<5;i++){
        const x=((i*113+row*47+t*(row%2?-.012:.012))%520+520)%520-20;
        const width=7+((i+row)%4)*4;rect(x,y,width,1,(i+row)%3?'#a6c5a2':'#f0c58c');
      }
    }
    ctx.restore();
    // Fine bank-edge glints and drifting surface motes.
    for(let i=0;i<4;i++){
      const x=(i*139+t*.006)%W;rect(x,waterline+4+(i%2)*2,10+(i%3)*5,1,'#a5c6a2');
    }
  }
  function drawAngler(){
    const breath=Math.sin(t*.003)*.7;
    const lean=phase==='charge'?charge*4:phase==='fight'?Math.min(1,tension)*3:0;
    const x=136+breath+lean, base=211+breath;
    // Soft contact shadow; knees, rolled cuffs and worn little boots.
    ctx.fillStyle='rgba(15,37,42,.42)';ctx.beginPath();ctx.ellipse(x+2,base+4,24,5,0,0,Math.PI*2);ctx.fill();
    rect(x-15,base-3,12,5,'#493f3b');rect(x-13,base-6,12,4,'#6f5142');rect(x+4,base-5,15,5,'#4a3e39');rect(x+8,base-8,12,4,'#765544');
    rect(x-9,base-18,14,14,'#536b5e');rect(x+5,base-20,12,13,'#415b54');rect(x-7,base-9,9,3,'#c69060');rect(x+7,base-8,9,3,'#c69060');
    // Canvas satchel behind the shoulder, with a brass clasp.
    rect(x-19,base-49,10,20,'#76523e');rect(x-18,base-46,7,13,'#a17149');rect(x-17,base-37,6,2,'#e0bd78');
    // Teal fisher's jacket: shaded outline, seams, collar and cuff pixels.
    polygon([[x-12,base-51],[x-4,base-57],[x+10,base-54],[x+16,base-45],[x+13,base-23],[x-11,base-23],[x-16,base-31]],'#294c4a');
    polygon([[x-10,base-50],[x-3,base-54],[x+8,base-52],[x+12,base-44],[x+9,base-27],[x-9,base-27],[x-12,base-33]],'#4b8075');
    polygon([[x-9,base-49],[x-4,base-51],[x-2,base-30],[x-8,base-29]],'#69958a');
    rect(x+1,base-49,2,17,'#315d58');rect(x+4,base-44,2,2,'#e3c17e');rect(x+4,base-37,2,2,'#e3c17e');
    polygon([[x-5,base-55],[x,base-58],[x+6,base-53],[x+2,base-48]],'#d69c61');
    // Elbow, sleeve and hand wrapped around the rod handle.
    polygon([[x+7,base-48],[x+14,base-45],[x+23,base-38],[x+20,base-33],[x+12,base-38],[x+5,base-40]],'#4b8075');
    rect(x+18,base-37,7,5,'#dfaa78');rect(x+22,base-36,4,3,'#f0c08a');
    // Neck, ear and expressive side-facing face.
    rect(x-2,base-65,10,10,'#c98761');rect(x+5,base-62,5,6,'#edb783');
    polygon([[x-5,base-78],[x+9,base-78],[x+14,base-72],[x+12,base-61],[x+5,base-57],[x-3,base-61],[x-7,base-67]],'#d9956b');
    rect(x+7,base-72,2,2,'#233941');rect(x+8,base-72,1,1,'#fff1cf');rect(x+12,base-67,2,3,'#bd7559');
    rect(x-6,base-78,13,5,'#443c3a');rect(x-4,base-81,12,5,'#493b38');rect(x-6,base-75,8,4,'#6a493c');
    // Distinctive ochre field hat with crown, brim and lit edge.
    polygon([[x-13,base-82],[x-8,base-89],[x+5,base-90],[x+12,base-84],[x+17,base-81],[x+13,base-78],[x-12,base-78],[x-17,base-80]],'#82593f');
    polygon([[x-10,base-83],[x-6,base-87],[x+5,base-88],[x+10,base-83],[x+15,base-81],[x-13,base-81]],'#c89658');
    rect(x-8,base-83,21,2,'#e3bd7c');rect(x-2,base-87,8,2,'#e9ca8c');
    // Reed-wrapped rod, gold reel and a flexible tip that reacts to each phase.
    const startX=x+24,startY=base-36;let tipX=x+51,tipY=base-83;
    if(phase==='charge')tipY-=charge*12;
    if(phase==='cast'){const p=Math.min(1,phaseT/.68);tipY=base-91+p*24;tipX+=Math.sin(p*Math.PI)*7;}
    if(phase==='fight'){tipX+=Math.min(1,tension)*12;tipY+=Math.min(1,tension)*23;}
    rod.x=tipX;rod.y=tipY;
    ctx.strokeStyle='#493b35';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(startX-1,startY+2);ctx.quadraticCurveTo(x+45,base-62,tipX,tipY);ctx.stroke();
    ctx.strokeStyle='#c9985d';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(startX,startY);ctx.quadraticCurveTo(x+44,base-65,tipX,tipY);ctx.stroke();
    rect(startX-5,startY+4,8,8,'#d4ae67');ctx.strokeStyle='#e6c77e';ctx.lineWidth=2;ctx.beginPath();ctx.arc(startX-1,startY+8,4,0,Math.PI*2);ctx.stroke();
    rect(x-1,base-53,3,2,'#f2d39a');
  }
  function drawFishSprite(x,y,scale=1,dir=-1,alpha=1){
    ctx.save();ctx.globalAlpha=alpha;ctx.translate(Math.round(x),Math.round(y));ctx.scale(scale*dir,scale);
    const f=fish, c=f.color, belly=f.belly, long=f.shape==='long', pike=f.name==='Reed Pike', sturgeon=f.name==='Old Lake Sturgeon';
    const tailBeat=Math.sin(t*.026)*4, body=long?
      [[-20,0],[-14,-7],[-5,-10],[7,-8],[17,-4],[22,0],[16,6],[5,9],[-7,8],[-15,5]]:
      f.shape==='round'?
      [[-15,0],[-11,-8],[-3,-12],[8,-11],[15,-5],[18,0],[13,8],[3,11],[-8,8],[-14,4]]:
      f.shape==='koi'?
      [[-18,0],[-13,-8],[-4,-11],[8,-9],[17,-4],[20,0],[14,7],[3,10],[-9,8],[-16,4]]:
      [[-17,0],[-12,-6],[-5,-8],[7,-7],[15,-3],[18,0],[13,5],[4,7],[-7,6],[-13,4]];
    const fin=pike?'#648f67':sturgeon?'#777f9d':f.shape==='round'?'#dc9954':f.shape==='koi'?'#e3a56a':'#75aaa0';
    // Soft underwater shadow, tail silhouette, then the dark ink outline.
    ctx.globalAlpha=alpha*.28;ctx.fillStyle='#0c3c4b';ctx.beginPath();ctx.ellipse(-1,11,long?25:20,4,0,0,Math.PI*2);ctx.fill();ctx.globalAlpha=alpha;
    polygon([[-13,0],[-21,-8-tailBeat],[-19,-1],[-24,0],[-19,2],[-21,8-tailBeat],[-13,3]],'#244f59');
    polygon([[-14,0],[-21,-7-tailBeat],[-19,-1],[-23,0],[-19,2],[-21,7-tailBeat],[-14,3]],fin);
    const outline=body.map(([px,py])=>[px*1.12,py*1.2]);polygon(outline,sturgeon?'#424b69':'#1d4d56');polygon(body,c);
    // Warm underside and bright top edge give the little sprite rounded volume.
    polygon(long?[[-8,3],[1,4],[13,1],[10,7],[2,9],[-7,7]]:
      [[-7,2],[1,4],[12,1],[9,6],[0,7],[-7,5]],belly);
    polygon(long?[[-10,-6],[-3,-9],[9,-7],[13,-5],[2,-5],[-6,-3]]:
      [[-9,-5],[-4,-8],[5,-7],[12,-4],[1,-5],[-6,-3]],sturgeon?'#c0c4d6':'#e7d69e');
    // Dorsal and lower fins, with tiny fin-ray stitches.
    polygon(long?[[-8,-8],[-5,-14],[-1,-9],[5,-8],[3,-6]]:
      [[-5,-8],[-2,-14],[2,-9],[7,-8],[2,-6]],fin);
    polygon([[-5,7],[-1,13],[3,8],[7,7]],fin);
    polygon([[0,-2],[5,-7],[10,-4],[6,3]],pike?'#a4c98d':f.shape==='round'?'#f3d285':'#8bc5b4');
    for(let i=0;i<3;i++)line(-2+i*3,-11,-1+i*3,-8,'#d4dba5',1);
    for(let i=0;i<3;i++)line(-3+i*3,8,-1+i*3,10,sturgeon?'#aeb4ca':'#b6c593',1);
    // Body markings differ by species: perch bars, pike chevrons, koi patches, sturgeon plates.
    if(f.shape==='round'){
      for(let i=0;i<4;i++){const sx=-7+i*5;polygon([[sx,-8],[sx+2,-8],[sx+5,3],[sx+3,5]],'#d9954f');}
      for(let i=0;i<3;i++)rect(-5+i*5,-1+(i%2),2,2,'#fff0bb');
    }else if(pike){
      for(let i=0;i<4;i++){const sx=-11+i*7;polygon([[sx,-5],[sx+4,-5],[sx+1,-1],[sx+5,2],[sx+2,2],[sx-1,-1],[sx-4,-1]],'#d0d59b');}
    }else if(sturgeon){
      for(let i=0;i<5;i++){rect(-10+i*5,-2+(i%2),2,4,'#c0c3d0');rect(-9+i*5,-3+(i%2),2,1,'#727d9d');}
      for(let i=0;i<3;i++)rect(-7+i*7,-7,3,2,'#d2cfbd');
    }else if(f.shape==='koi'){
      polygon([[-8,-9],[-3,-11],[3,-9],[0,-4],[-6,-3]],c);polygon([[3,2],[11,0],[9,6],[4,8]],c);
    }else{
      ctx.save();ctx.beginPath();ctx.moveTo(body[0][0],body[0][1]);for(const pt of body.slice(1))ctx.lineTo(pt[0],pt[1]);ctx.closePath();ctx.clip();
      for(let row=0;row<2;row++)for(let col=0;col<5;col++){let sx=-9+col*4+(row%2)*2,sy=-3+row*5;rect(sx,sy,2,2,(row+col)%2?'#c9dfb1':'#74b8aa');}
      ctx.restore();
    }
    // Gills, mouth barbels for the ancient fish, and a bright glassy eye.
    line(7,-5,9,2,'#527c71',1);line(9,-4,11,2,'#e8deb1',1);line(17,2,21,1,'#263e49',1);
    if(sturgeon){line(14,3,19,8,'#d9cda9',1);line(17,3,22,7,'#d9cda9',1);}
    ctx.fillStyle='#f6e9ba';ctx.fillRect(12,-4,4,4);ctx.fillStyle='#182f3c';ctx.fillRect(14,-3,2,2);ctx.fillStyle='#fff';ctx.fillRect(14,-3,1,1);
    line(-7,-5,4,-6,'rgba(255,243,198,.5)',1);
    ctx.restore();
  }
  function drawUnderwater(){
    if(phase==='wait'||phase==='bite'){
      const approach=phase==='bite'?1:Math.max(0,1-waitLeft/5);
      fishX=Math.min(451,bobberX+48-approach*38+Math.sin(t*.002)*5);
      drawFishSprite(fishX,waterline+34+Math.sin(t*.003)*3,.9,-1,.24+approach*.52);
    }
    if(phase==='fight'){
      const yy=waterline+35+Math.sin(fightT*7)*5;
      drawFishSprite(fishX,yy,fish.shape==='long'?1.3:1.16,Math.sin(fightT*5)>0?1:-1,.98);
    }
    if(phase==='landed'){
      fishX=190+Math.sin(t*.018)*5;
      const leap=Math.max(0,Math.sin(Math.min(1,phaseT/.95)*Math.PI));
      drawFishSprite(fishX,190-leap*26,fish.shape==='long'?1.36:1.22,1,1);
    }
  }
  function drawBobber(){
    if(!['cast','wait','bite','fight','landed'].includes(phase))return;
    let x,y;
    if(phase==='cast'){
      const p=Math.min(1,phaseT/.68),ease=p*p*(3-2*p);
      x=rod.x+(bobberX-rod.x)*ease;
      y=rod.y+(waterline-rod.y)*ease-Math.sin(p*Math.PI)*62;
    }else{
      const dip=phase==='bite'?8+Math.sin(t*.04)*2:phase==='fight'?Math.sin(t*.03)*2:0;
      x=phase==='fight'?bobberX-hookedProgress*45:bobberX;y=waterline+2+dip;
    }
    ctx.strokeStyle='#fff0cf';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(rod.x,rod.y);ctx.quadraticCurveTo((rod.x+bobberX)/2,rod.y-22,x,y);ctx.stroke();
    for(let i=0;i<3;i++){ctx.strokeStyle=`rgba(196,226,192,${.45-i*.12})`;ctx.beginPath();ctx.ellipse(x,y+4,6+i*5,2+i,0,0,Math.PI*2);ctx.stroke();}
    rect(x-2,y-7,4,5,'#f8efcf');rect(x-3,y-3,6,4,'#e9886d');rect(x-2,y+1,4,2,'#b95b56');
    if(phase==='bite'){ctx.strokeStyle='#ffe08d';ctx.lineWidth=1;ctx.beginPath();ctx.arc(x,y,12+Math.sin(t*.035)*4,0,Math.PI*2);ctx.stroke();}
  }
  function drawStatus(){
    if(phase==='charge'){
      rect(162,19,156,31,'#183c45');rect(164,21,152,27,'#28544e');label('CAST DISTANCE',240,29,8,'#fff0cf');rect(174,38,132,5,'#19353c');rect(176,39,Math.max(2,128*charge),3,charge>.82?'#f2a965':'#e9d184');
      for(let i=0;i<5;i++)rect(176+i*26,38,1,5,'#a6ba91');
    }else if(phase==='bite'){
      rect(156,17,168,30,'#76474a');rect(159,20,162,24,'#a85b55');label('BITE!  SET THE HOOK',240,32,9,'#fff1c9');
    }else if(phase==='fight'){
      rect(148,15,184,42,'#173a43');label('LINE TENSION',240,25,8,'#e5edcf');rect(160,34,160,10,'#112b37');
      rect(162,36,100,6,'#65a987');rect(262,36,28,6,'#e7c267');rect(290,36,28,6,'#dc7161');
      const marker=162+Math.min(156,Math.max(0,tension*156));rect(marker-2,32,4,14,'#fff4d7');
      label(tension>.82?'LET GO!':(Math.sin(fightT*2.4)>.55?'FISH SURGING':'REEL IN'),240,53,7,tension>.82?'#ff9e80':'#e6edcf');
    }else if(phase==='landed'||phase==='lost'){
      rect(155,18,170,29,'#173a43');label(phase==='landed'?`LANDED: ${fish.name.toUpperCase()}`:'THE FISH GOT AWAY',240,32,8,phase==='landed'?'#ffe29b':'#efd8bd');
    }
    if(toastTimer>0&&phase==='landed'){rect(161,64,158,20,'#1e484b');label(toast,240,74,8,'#ffdf9a');}
  }
  function drawEffects(){
    particles=particles.filter(p=>p.life>0);for(const p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;p.life-=delta;rect(p.x,p.y,p.size,p.size,p.color);}
    ripples=ripples.filter(r=>r.life>0);for(const r of ripples){r.life-=delta;r.r+=delta*12;ctx.strokeStyle=`rgba(207,230,190,${Math.max(0,r.life/r.max)*.55})`;ctx.lineWidth=1;ctx.beginPath();ctx.ellipse(r.x,r.y,r.r,r.r*.32,0,0,Math.PI*2);ctx.stroke();}
  }
  function draw(){drawBackdrop();drawWater();drawUnderwater();drawAngler();drawBobber();drawEffects();drawStatus();}
  function update(dt){
    phaseT+=dt;
    if(phase==='charge'&&inputHeld)charge=Math.min(1,charge+dt*.58);
    if(phase==='cast'&&phaseT>.68){phase='wait';phaseT=0;waitLeft=rand(3.1,5.4);fish=chooseFish();fishX=bobberX+48;splash(bobberX,waterline+2,'#a9d7c1',7);syncUI();}
    else if(phase==='wait'){waitLeft-=dt;if(waitLeft<=0){phase='bite';biteLeft=1.55;splash(bobberX,waterline+2,'#c8e5c0',8);announcement.textContent='Fish on! Press now to set the hook.';syncUI();}}
    else if(phase==='bite'){biteLeft-=dt;if(biteLeft<=0){phase='wait';waitLeft=rand(2.8,5.2);missCount++;syncUI();}}
    else if(phase==='fight'){
      fightT+=dt;
      const surge=Math.sin(fightT*2.5)>.55;
      if(inputHeld){hookedProgress+=dt*(surge?.17:.37);tension+=dt*(surge?.71:.34);}
      else{tension=Math.max(.08,tension-dt*1.12);hookedProgress=Math.max(0,hookedProgress-dt*.012);}
      tension=Math.min(1.12,tension);
      if(tension>.94)snapTime+=dt;else snapTime=0;
      fishX=bobberX-hookedProgress*48+Math.sin(fightT*5)*5;
      if(snapTime>.43){loseFish();}
      else if(hookedProgress>=1){landFish();}
    }
    if(phase==='landed'||phase==='lost'){if(phaseT>3.2){phase='idle';phaseT=0;syncUI();}}
    if(toastTimer>0)toastTimer=Math.max(0,toastTimer-dt);
  }
  function loop(now){delta=Math.min(.05,(now-last)/1000||0);last=now;t+=delta;update(delta);draw();requestAnimationFrame(loop);}
  syncUI();requestAnimationFrame(loop);
})();
</script>
